name: CI

on:
  push:
    branches:
      - develop
      - version-15
      - version-16
  pull_request:
  schedule:
    # Weekly run catches upstream ERPNext report and ledger changes early
    - cron: "0 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            # Frappe 15.128 requires Python 3.11 or later
            python: "3.11"
            node: 18
            mariadb: "10.6"
          - frappe: version-16
            python: "3.14"
            node: 24
            mariadb: "11.8"
    name: Server (Frappe ${{ matrix.frappe }})

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.frappe }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.frappe }}-pip-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      # The runner's MariaDB 11.8 client requires TLS by default; the 10.6 server has none
      - name: Allow non-TLS MariaDB client connections
        if: matrix.mariadb == '10.6'
        run: printf '[client]\nskip-ssl\n' > ~/.my.cnf

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch ${{ matrix.frappe }} --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch ${{ matrix.frappe }}
          bench get-app frappe_psak_id $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app frappe_psak_id
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_psak_id
        env:
          TYPE: server

      # The POT and PO files are committed, like ERPNext's. Regenerate them and fail when the
      # committed ones are stale, ignoring the timestamps Babel rewrites on every run. Babel's
      # output differs slightly between versions, so one Frappe version is the reference.
      - name: Check translation files are up to date
        if: matrix.frappe == 'version-16'
        working-directory: /home/runner/frappe-bench
        run: |
          bench generate-pot-file --app frappe_psak_id
          bench update-po-files --app frappe_psak_id
          bench compile-po-to-mo --app frappe_psak_id --force
          cd apps/frappe_psak_id
          if ! git diff --exit-code -I '^"(POT-Creation-Date|PO-Revision-Date): ' -- frappe_psak_id/locale \
            || [ -n "$(git ls-files --others --exclude-standard -- frappe_psak_id/locale)" ]; then
            git --no-pager diff -- frappe_psak_id/locale
            git ls-files --others --exclude-standard -- frappe_psak_id/locale
            echo "::error::Translation files are stale. Run 'bench generate-pot-file --app frappe_psak_id' and 'bench update-po-files --app frappe_psak_id', then commit frappe_psak_id/locale."
            exit 1
          fi
